apiVersion: v1
kind: Namespace
metadata:
  name: ada-system
  labels:
    kubernetes.io/metadata.name: ada-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ada-gateway
  namespace: ada-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ada-gateway-workloads
  namespace: agent-sandbox-workloads
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ada-gateway-workloads
  namespace: agent-sandbox-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ada-gateway-workloads
subjects:
  - kind: ServiceAccount
    name: ada-gateway
    namespace: ada-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxy-state
  namespace: ada-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ada-gateway-config
  namespace: ada-system
data:
  gateway.yaml: |
    listenAddr: ":8080"
    workloadsNamespace: agent-sandbox-workloads
    cliproxy:
      enabled: true
      baseURL: http://127.0.0.1:8317
    providers:
      openai:
        upstreamURL: https://api.openai.com
      anthropic:
        upstreamURL: https://api.anthropic.com
      google:
        upstreamURL: https://generativelanguage.googleapis.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-gateway
  namespace: ada-system
  labels:
    app.kubernetes.io/name: ada-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ada-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ada-gateway
    spec:
      serviceAccountName: ada-gateway
      automountServiceAccountToken: false
      containers:
        - name: ada-gateway
          image: ada-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADA_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ada-signing-key
                  key: signing-key
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: ada-gateway-secrets
                  key: github-pat
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ada-gateway-secrets
                  key: cliproxy-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ada-gateway-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ada-gateway-secrets
                  key: anthropic-api-key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ada-gateway-secrets
                  key: gemini-api-key
                  optional: true
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/ada/gateway.yaml
              subPath: gateway.yaml
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 125m
              memory: 256Mi
            limits:
              cpu: 125m
              memory: 256Mi
        - name: cliproxy
          image: eceasy/cli-proxy-api:v7.3.6@sha256:94a1616cb6731cb19f5873e096a1e8611d78d4644486809546905bc0e1fc23cd
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/8317
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - exec 3<>/dev/tcp/127.0.0.1/8317
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: cliproxy-config
              mountPath: /CLIProxyAPI/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: cliproxy-state
              mountPath: /root/.cli-proxy-api
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 125m
              memory: 256Mi
            limits:
              cpu: 125m
              memory: 256Mi
      volumes:
        - name: gateway-config
          configMap:
            name: ada-gateway-config
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: cliproxy-config
          secret:
            secretName: ada-gateway-secrets
            items:
              - key: cliproxy-config.yaml
                path: config.yaml
        - name: cliproxy-state
          persistentVolumeClaim:
            claimName: cliproxy-state
---
apiVersion: v1
kind: Service
metadata:
  name: ada-gateway
  namespace: ada-system
  labels:
    app.kubernetes.io/name: ada-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ada-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
